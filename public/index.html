<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#faf9fc">
<meta name="description" content="小铺子 · Muse 账号（10亿 tokens，永不过期），付款确认后自动发卡。">
<title>小铺子 · Muse 账号 10亿 tokens</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #faf9fc;
    --bg-white: #ffffff;
    --text: #3b3b4e;
    --text-secondary: #7d7d90;
    --text-tertiary: #a9a9bb;
    --accent: #8b7cf6;
    --accent2: #7fb0f2;
    --accent3: #6fd8c9;
    --grad: linear-gradient(135deg, #b39df5 0%, #93b8f5 52%, #8adcd0 100%);
    --grad-soft: linear-gradient(135deg, #cfc2fa 0%, #bcd6fa 52%, #b3ece2 100%);
    --accent-hover: #7a68ee;
    --border: #e9e4f2;
    --divider: rgba(80,66,130,.08);
    --green: #2ea37e;
    --green-bg: rgba(46,163,126,.10);
    --shadow-sm: 0 2px 10px rgba(139,124,200,.07);
    --shadow-md: 0 10px 28px rgba(139,124,200,.12);
    --shadow-lg: 0 18px 48px rgba(139,124,200,.16);
    --glow: 0 6px 22px rgba(167,139,250,.30);
    --radius-sm: 14px;
    --radius-md: 20px;
    --radius-lg: 24px;
    --radius-pill: 999px;
    --max-width: 1200px;
  }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: -apple-system, "SF Pro Display", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background-color: var(--bg);
    background-image:
      radial-gradient(720px 420px at 50% -80px, rgba(196,174,250,.30), transparent 65%),
      radial-gradient(560px 380px at 92% 108%, rgba(147,184,245,.22), transparent 60%),
      radial-gradient(480px 320px at 4% 92%, rgba(138,220,208,.16), transparent 60%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.55;
    font-size: 17px;
    min-height: 100vh;
  }
  ::selection { background: rgba(179,157,245,.35); color: #3b3b4e; }
  a { color: #7c6ff0; text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; }

  /* 顶部导航：浅色毛玻璃 */
  .topbar {
    background: rgba(250,249,252,.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--divider);
    color: var(--text);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 30;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .topbar .logo { font-size: 17px; font-weight: 600; flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; }
  .logo-badge {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: 10px;
    background: var(--grad);
    color: #fff;
    font-size: 18px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(167,139,250,.35);
  }
  .logo-text { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .logo small { display: block; font-size: 11px; font-weight: 400; color: var(--text-tertiary); }
  .topbar .obtn {
    background: #ffffff;
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    transition: background .15s, border-color .15s, box-shadow .15s;
  }
  .topbar .obtn:hover { background: #f6f2fd; border-color: #d9cdf5; box-shadow: var(--shadow-sm); }
  .topbar .menu-btn { background: none; border: none; color: var(--text); font-size: 22px; line-height: 1; padding: 6px; }

  /* Hero 区：浅色柔美 */
  .hero {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 68px 16px 44px;
    text-align: center;
    position: relative;
  }
  .hero-eyebrow {
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .35em;
    text-indent: .35em;
    color: #8b7cf6;
    margin-bottom: 16px;
  }
  .hero h1 {
    font-size: clamp(42px, 7vw, 72px);
    font-weight: 600;
    letter-spacing: -.015em;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 14px;
  }
  .hero h1 .grad {
    display: block;
    background: linear-gradient(135deg, #9d86f2 0%, #7fa8ef 52%, #5ccfc0 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  .hero p {
    font-size: clamp(16px, 2vw, 20px);
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.55;
    max-width: 600px;
    margin: 0 auto;
  }
  .hero-chips {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-top: 24px;
  }
  .hero-chips span {
    padding: 7px 14px;
    border-radius: var(--radius-pill);
    background: #ffffff;
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    box-shadow: var(--shadow-sm);
  }
  .hero-chips span:first-child {
    border-color: #d9cdf5;
    color: #6d5bd0;
    background: #f3efff;
  }
  .hero .contact-link {
    display: inline-block;
    margin-top: 30px;
    padding: 11px 26px;
    font-size: 15px;
    font-weight: 600;
    color: #fff;
    background: var(--grad);
    border: none;
    border-radius: var(--radius-pill);
    box-shadow: var(--glow);
    transition: filter .15s, transform .15s;
  }
  .hero .contact-link:hover {
    filter: brightness(1.04);
    transform: translateY(-1px);
    text-decoration: none;
  }

  /* 公告栏 */
  .marquee {
    background: #ffffff;
    border-top: 1px solid var(--divider);
    border-bottom: 1px solid var(--divider);
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex; gap: 10px; align-items: center; overflow: hidden;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .mq-dot {
    width: 8px; height: 8px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--grad);
    box-shadow: 0 0 10px rgba(167,139,250,.55);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse { 50% { opacity: .35; } }
  .marquee span { white-space: nowrap; animation: scroll 20s linear infinite; display: inline-block; }
  @keyframes scroll { from { transform: translateX(100%);} to { transform: translateX(-100%);} }

  /* 页签 */
  .tabs {
    display: flex;
    background: rgba(255,255,255,.65);
    border-bottom: 1px solid var(--divider);
    position: sticky;
    top: 53px;
    z-index: 20;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .tabs button {
    flex: 1;
    padding: 14px 0;
    background: none;
    border: none;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
    position: relative;
    transition: color .15s;
  }
  .tabs button.active { color: var(--text); }
  .tabs button.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 3px;
    background: var(--grad);
    border-radius: 2px;
  }

  /* 分类横向滚动 */
  .cats {
    display: flex;
    gap: 8px;
    padding: 16px 16px 8px;
    overflow-x: auto;
    scrollbar-width: none;
    background: transparent;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cats button {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: #ffffff;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all .15s;
    box-shadow: var(--shadow-sm);
  }
  .cats button:hover { border-color: #cfc2f5; color: var(--text); }
  .cats button.active {
    background: var(--grad);
    color: #fff;
    border-color: transparent;
    box-shadow: 0 4px 14px rgba(167,139,250,.35);
  }
  .cats button .n { opacity: .65; font-size: 11px; margin-left: 4px; }

  /* 商品网格：响应式列数 */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 16px 100px;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px 24px 100px; } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 24px 24px 100px; } }

  .card {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .18s, box-shadow .18s, border-color .18s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-3px);
    border-color: #cfc2f5;
    box-shadow: var(--shadow-md);
  }
  .thumb {
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    position: relative;
    overflow: hidden;
  }
  /* 浅色柔光遮罩：淡淡的白色光晕，柔和色块 */
  .thumb::after,
  .detail-poster::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,.06) 55%, rgba(255,255,255,0) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .thumb > *,
  .detail-poster > * { position: relative; z-index: 2; }

  .card .info { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
  .card h3 {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.33;
    height: 40px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    color: var(--text);
  }
  .card h3 .oos { color: var(--text-tertiary); font-size: 12px; font-weight: 400; }
  .tag-auto {
    display: inline-block;
    font-size: 11px;
    font-weight: 600;
    color: var(--green);
    margin-top: 6px;
    background: none;
    border: none;
    padding: 0;
  }
  .price {
    color: var(--text);
    font-weight: 700;
    font-size: 19px;
    margin-top: auto;
    padding-top: 8px;
  }
  .price small { font-size: 13px; font-weight: 400; color: var(--text-secondary); }
  .meta-line { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

  /* 详情页 */
  .detail-top {
    background: rgba(250,249,252,.82);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--divider);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 30;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .detail-top button { background: none; border: none; font-size: 22px; color: var(--text); padding: 6px; line-height: 1; }
  .detail-top h2 { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-poster {
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 110px;
    position: relative;
    overflow: hidden;
  }
  .detail-body {
    background: transparent;
    padding: 24px 16px 8px;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .detail-body h2 {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -.01em;
  }
  .detail-body .price {
    font-size: 30px;
    font-weight: 700;
    color: var(--text);
    margin: 10px 0 4px;
  }
  .detail-body .price small { font-size: 17px; color: var(--text-secondary); }
  .feat-strip {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 16px;
  }
  .feat-strip span {
    padding: 6px 12px;
    border-radius: var(--radius-pill);
    background: #ffffff;
    border: 1px solid var(--border);
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    box-shadow: var(--shadow-sm);
  }
  .feat-strip span:first-child {
    border-color: #d9cdf5;
    color: #6d5bd0;
    background: #f3efff;
  }
  .shop-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: #ffffff;
    border: 1px solid var(--border);
    margin: 16px auto;
    padding: 16px;
    border-radius: var(--radius-md);
    max-width: var(--max-width);
    box-shadow: var(--shadow-sm);
  }
  .shop-row .avatar {
    width: 44px; height: 44px; flex-shrink: 0;
    font-size: 20px; font-weight: 700; color: #fff;
    background: var(--grad);
    border-radius: 13px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 4px 14px rgba(167,139,250,.35);
  }
  .shop-row .nm { flex: 1; font-size: 15px; font-weight: 600; }
  .shop-row button {
    border: 1px solid var(--border);
    color: var(--text);
    background: #ffffff;
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    transition: border-color .15s, background .15s;
  }
  .shop-row button:hover { border-color: #cfc2f5; background: #f8f5fe; }
  .desc-box {
    background: #ffffff;
    border: 1px solid var(--border);
    margin: 0 auto 16px;
    padding: 20px 16px;
    border-radius: var(--radius-md);
    max-width: var(--max-width);
    box-shadow: var(--shadow-sm);
  }
  .desc-box h3 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .desc-box .warn {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
    background: #faf8fd;
    padding: 12px;
    border-radius: var(--radius-sm);
  }
  .desc-box p { font-size: 15px; color: var(--text-secondary); line-height: 1.7; }
  .rec-title {
    font-size: 19px;
    font-weight: 600;
    padding: 8px 16px 16px;
    max-width: var(--max-width);
    margin: 0 auto;
  }

  /* 底部操作栏 */
  .buybar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(250,249,252,.88);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--divider);
    display: flex;
    align-items: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    gap: 12px;
    z-index: 30;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .buybar .bb {
    background: none;
    border: none;
    font-size: 11px;
    color: var(--text-tertiary);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 0 8px;
    flex: 1;
  }
  .buybar .bb span { line-height: 1; display: flex; align-items: center; justify-content: center; }
  .buybar .bb svg { width: 22px; height: 22px; display: block; }
  .buybar .buy-now {
    flex: 2;
    border: none;
    border-radius: var(--radius-pill);
    padding: 14px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--grad);
    box-shadow: var(--glow);
    transition: filter .15s, transform .15s;
  }
  .buybar .buy-now:hover { filter: brightness(1.04); }
  .buybar .buy-now:disabled { background: #e9e6f0; color: var(--text-tertiary); box-shadow: none; }

  /* 底部弹窗 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(80,66,130,.30);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 40;
    align-items: flex-end;
    justify-content: center;
  }
  .modal.open { display: flex; }
  .sheet {
    background: #ffffff;
    border: 1px solid var(--border);
    border-bottom: none;
    width: 100%;
    max-width: 600px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow: auto;
    box-shadow: var(--shadow-lg);
    position: relative;
  }
  .sheet::before {
    content: '';
    position: absolute;
    top: 0; left: 20%; right: 20%;
    height: 3px;
    background: var(--grad-soft);
    border-radius: 2px;
  }
  .sheet .grab { width: 44px; height: 5px; background: #e6e0f2; border-radius: 3px; margin: 0 auto 16px; }
  .sheet h2 { font-size: 19px; font-weight: 600; margin-bottom: 12px; }
  .sheet h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; }
  .mini-goods { display: flex; gap: 12px; align-items: center; }
  .mini-goods .thumb { width: 72px; height: 72px; border-radius: var(--radius-sm); font-size: 36px; flex-shrink: 0; position: relative; overflow: hidden; }
  .mini-goods .t { flex: 1; min-width: 0; }
  .mini-goods .t b { font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc-scroll {
    background: #faf8fd;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    max-height: 120px;
    overflow: auto;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    white-space: pre-line;
    margin-top: 12px;
  }
  .stepper { display: flex; align-items: center; gap: 0; margin-top: 6px; }
  .stepper button {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    background: #ffffff;
    font-size: 18px;
    color: var(--text);
    border-radius: 0;
    transition: background .15s, border-color .15s;
  }
  .stepper button:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .stepper button:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .stepper button:disabled { color: #d5d0e4; }
  .stepper button:hover:not(:disabled) { background: #f8f5fe; }
  .stepper .qty {
    width: 56px;
    text-align: center;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    background: #fbfafc;
    line-height: 38px;
    font-size: 17px;
    font-weight: 500;
  }
  input[type="text"], input[type="email"], textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    margin-top: 6px;
    background: #fbfafc;
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
    outline: none;
    border-color: #b39df5;
    box-shadow: 0 0 0 3px rgba(179,157,245,.20);
  }
  input::placeholder { color: var(--text-tertiary); }
  .hint { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; line-height: 1.5; }
  .pay-methods { display: flex; gap: 10px; margin-top: 8px; }
  .pay-methods button {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: #ffffff;
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    transition: all .15s;
  }
  .pay-methods button:hover { border-color: #cfc2f5; }
  .pay-methods button.sel {
    border-color: #b39df5;
    color: #6d5bd0;
    background: #f3efff;
    box-shadow: 0 0 0 3px rgba(179,157,245,.15);
  }
  .sheet .foot { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .sheet .foot .total { flex: 1; font-size: 15px; }
  .sheet .foot .total b { color: var(--text); font-size: 22px; font-weight: 700; }
  .btn-orange {
    border: none;
    border-radius: var(--radius-pill);
    padding: 14px 28px;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    background: var(--grad);
    box-shadow: var(--glow);
    transition: filter .15s;
  }
  .btn-orange:hover { filter: brightness(1.04); }
  .btn-orange:disabled { background: #e9e6f0; color: var(--text-tertiary); box-shadow: none; }
  .btn-ghost {
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 500;
    background: #ffffff;
    color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .btn-ghost:hover { border-color: #cfc2f5; background: #f8f5fe; }

  /* 支付页 */
  .pay-qr { text-align: center; padding: 10px 0; }
  .pay-qr img { width: 240px; height: 240px; object-fit: contain; background: #fff; padding: 10px; border: 1px solid var(--border); border-radius: var(--radius-md); box-shadow: var(--shadow-sm); }
  .pay-qr .noqr { width: 240px; height: 240px; margin: 0 auto; border: 1px dashed var(--border); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 14px; padding: 20px; line-height: 1.6; }
  .order-no { text-align: center; font-size: 15px; margin: 6px 0; color: var(--text-secondary); }
  .order-no b { color: var(--text); }

  /* 账号盒 */
  .keybox {
    background: rgba(179,157,245,.08);
    border: 1px dashed rgba(139,124,246,.50);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin: 12px 0;
  }
  .keybox code { display: block; font-size: 17px; letter-spacing: 1px; padding: 8px 0; word-break: break-all; font-family: -apple-system, "SF Mono", "Menlo", monospace; color: var(--text); }
  .keybox .kv-label { display: inline-block; min-width: 68px; color: var(--text-secondary); font-size: 13px; }
  .keybox .kwarn { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
  .keybox button {
    margin-top: 8px;
    border: 1px solid var(--border);
    color: var(--text);
    background: #ffffff;
    border-radius: var(--radius-pill);
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 500;
  }
  .keybox button:hover { border-color: #cfc2f5; }

  .status-pill { display: inline-block; font-size: 12px; font-weight: 600; border-radius: var(--radius-pill); padding: 4px 10px; }
  .st-pending { background: #fdf3dd; color: #92600a; }
  .st-paid { background: #e6f0fd; color: #2f6fb2; }
  .st-delivered { background: #e0f6ec; color: #1f7a54; }
  .st-cancelled { background: #fdecef; color: #b03a4b; }

  .order-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; margin: 12px 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: box-shadow .15s, border-color .15s; }
  .order-card:hover { box-shadow: var(--shadow-md); border-color: #cfc2f5; }
  .order-card .row1 { display: flex; justify-content: space-between; align-items: center; }
  .order-card .nm { font-size: 15px; font-weight: 600; }
  .order-card .sub { font-size: 13px; color: var(--text-tertiary); margin-top: 6px; line-height: 1.6; }

  /* 商家页 */
  .seller-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 20px 16px; margin: 16px; box-shadow: var(--shadow-sm); }
  .seller-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .seller-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.8; white-space: pre-line; }

  /* 搜索条 */
  .search-wrap { background: transparent; padding: 16px; display: flex; gap: 10px; max-width: var(--max-width); margin: 0 auto; }
  .search-wrap input { flex: 1; margin-top: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; background: #ffffff; color: var(--text); box-shadow: var(--shadow-sm); }
  .search-wrap input:focus { outline: none; border-color: #b39df5; box-shadow: 0 0 0 3px rgba(179,157,245,.20); }
  .search-wrap button {
    border: none;
    border-radius: var(--radius-sm);
    padding: 0 24px;
    color: #fff;
    background: var(--grad);
    font-size: 15px;
    font-weight: 700;
    transition: filter .15s;
    box-shadow: var(--glow);
  }
  .search-wrap button:hover { filter: brightness(1.04); }

  .empty { text-align: center; color: var(--text-tertiary); padding: 60px 20px; font-size: 15px; line-height: 1.8; }
  .note {
    background: rgba(179,157,245,.12);
    color: #6d5bd0;
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin: 12px 0;
    line-height: 1.6;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-tertiary);
    padding: 24px 16px 100px;
    line-height: 1.8;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .menu-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 16px 4px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--divider);
    font-size: 17px;
    color: var(--text);
  }
  .menu-item:last-child { border-bottom: none; }

  /* 弹窗关闭按钮 */
  .sheet .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #f2eef9;
    border: none;
    font-size: 18px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sheet .close-btn:hover { background: #e9e2f6; color: var(--text); }

  /* 购买流程（三步） */
  .section-title { font-size: 19px; font-weight: 600; padding: 8px 16px 12px; max-width: var(--max-width); margin: 0 auto; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 16px 8px; max-width: var(--max-width); margin: 0 auto; }
  @media (max-width: 767px) { .steps { grid-template-columns: 1fr; } }
  .step { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 16px; box-shadow: var(--shadow-sm); }
  .step-num { width: 30px; height: 30px; border-radius: 50%; background: var(--grad); color: #fff; font-size: 15px; font-weight: 700; display: flex; align-items: center; justify-content: center; margin-bottom: 10px; box-shadow: 0 4px 12px rgba(167,139,250,.30); }
  .step h4 { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .step p { font-size: 13px; color: var(--text-secondary); line-height: 1.6; }
  .note-card { background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-md); padding: 18px 16px; margin: 12px 16px 24px; max-width: var(--max-width); box-shadow: var(--shadow-sm); }
  @media (min-width: 1200px) { .note-card { margin-left: auto; margin-right: auto; } }
  .note-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .note-card ul { list-style: none; }
  .note-card li { font-size: 14px; color: var(--text-secondary); line-height: 1.9; padding-left: 18px; position: relative; }
  .note-card li::before { content: ''; position: absolute; left: 2px; top: 11px; width: 6px; height: 6px; border-radius: 50%; background: var(--grad); }
  .cap-list { margin-top: 14px; border-top: 1px solid var(--divider); }
  .cap-list .cap { display: flex; align-items: baseline; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--divider); font-size: 14px; }
  .cap-list .cap:last-child { border-bottom: none; }
  .cap .mark { flex-shrink: 0; width: 20px; height: 20px; border-radius: 50%; font-size: 12px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; transform: translateY(3px); }
  .cap .mark.ok { background: #e0f6ec; color: #1f7a54; }
  .cap .mark.no { background: #fdecef; color: #b03a4b; }
  .cap b { font-weight: 600; }
  .cap span { color: var(--text-secondary); }
  .hero-note { font-size: 13px; color: var(--text-tertiary); margin-top: 16px; }
  .sheet-step { font-size: 12px; font-weight: 600; letter-spacing: .12em; color: #8b7cf6; margin-bottom: 10px; }
  .account-hero { background: linear-gradient(180deg, rgba(179,157,245,.14), rgba(179,157,245,.04)); border: 1px solid #d9cdf5; border-radius: var(--radius-md); padding: 18px 16px; margin: 12px 0; }
  .account-hero h3 { font-size: 17px; font-weight: 700; margin-bottom: 2px; }
  .account-hero .ah-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 12px; }
  .acc-row { display: flex; align-items: center; gap: 8px; background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 12px; margin-top: 8px; }
  .acc-row .kv-label { min-width: 64px; flex-shrink: 0; }
  .acc-row code { flex: 1; min-width: 0; font-size: 15px; padding: 0; }
  .acc-row a { flex: 1; min-width: 0; word-break: break-all; }
  .acc-row button { flex-shrink: 0; margin-top: 0; }
  .login-steps { margin: 14px 0 0; padding: 12px 12px 4px; background: #ffffff; border: 1px solid var(--border); border-radius: var(--radius-sm); }
  .login-steps h4 { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
  .login-steps ol { margin: 0 0 8px 20px; }
  .login-steps li { font-size: 13px; color: var(--text-secondary); line-height: 1.9; }
  .thumb, .detail-poster { font-weight: 700; }

</style>

</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
let SETTINGS = {};
let allItems = [];
let catCounts = {};
let curCat = '';
let searchQuery = '';
let curTab = 'goods'; // goods | seller | search
let detailId = null;
let buyState = null; // {item, qty, email, payMethod}
let currentOrder = null;

const $ = (s) => document.querySelector(s);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function statusLabel(s) {
  return { pending: '待付款', paid: '待确认收款', delivered: '已发账号', cancelled: '已取消' }[s] || s;
}
function statusClass(s) { return 'status-pill st-' + s; }
function stockText(it) {
  if (it.stock <= 0) return '缺货补货中';
  if (it.stock <= 2) return '仅剩 ' + it.stock + ' 件';
  return '库存 ' + it.stock + ' 件';
}
// 购买流程（三步），首页与详情页共用
function stepsHtml() {
  return `<div class="section-title">购买流程</div>
  <div class="steps">
    <div class="step"><div class="step-num">1</div><h4>选购下单</h4><p>填写你的邮箱，选择微信或支付宝，确认下单。</p></div>
    <div class="step"><div class="step-num">2</div><h4>扫码付款</h4><p>扫码支付 ¥10，付款后点「我已付款」。</p></div>
    <div class="step"><div class="step-num">3</div><h4>自动发卡</h4><p>确认收款后，账号自动发放到订单页，复制邮箱密码即可登录。</p></div>
  </div>`;
}
// 购买前请确认，首页与详情页共用
function confirmCardHtml() {
  return `<div class="note-card"><h3>购买前请确认</h3><ul>
    <li>支持 AI 对话与视频生成，10 亿 tokens 永不过期。</li>
    <li>暂不支持语音通话（账号地区限制）。</li>
    <li>账号一经发出不支持退款，请确认后再下单。</li>
    <li>收到账号后请尽快登录并修改密码。</li>
  </ul></div>`;
}

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || '请求失败');
  return d;
}

// ---------- 首页 ----------
function renderHome() {
  const cats = [['', '全部']];
  for (const it of allItems) { if (!cats.some(([k]) => k === it.category)) cats.push([it.category, it.categoryLabel || it.category]); }
  let list = allItems;
  if (curTab === 'goods' && curCat) list = list.filter((it) => it.category === curCat);
  if (curTab === 'search' && searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter((it) => it.name.toLowerCase().includes(q) || it.game.toLowerCase().includes(q) || (it.desc || '').toLowerCase().includes(q));
  }
  const cards = list.length ? list.map((it) => `
    <div class="card" onclick="goDetail('${it.id}')">
      <div class="thumb" style="background:${it.color}">${it.emoji}</div>
      <div class="info">
        <h3>${esc(it.name)}${it.stock <= 0 ? ' <span class="oos">缺货</span>' : ''}</h3>
        ${it.autoDeliver ? '<span class="tag-auto">✓ 自动发货</span>' : ''}
        <div class="price"><small>¥</small>${it.price}</div>
        <div class="meta-line">${esc(it.game)} · ${stockText(it)}${it.sales ? ' · 已售 ' + it.sales : ''}</div>
      </div>
    </div>`).join('') : `<div class="empty">店里暂时没有商品，正在补货中<br>请稍后再来看看</div>`;

  $('#app').innerHTML = `
  <div class="topbar">
    <div class="logo"><span class="logo-badge">M</span><span class="logo-text">${esc(SETTINGS.shopName || '小铺子')}<small>Muse 账号 · 自动发卡</small></span></div>
    <button class="obtn" onclick="goOrder()">订单查询</button>
    <button class="menu-btn" onclick="openMenu()">☰</button>
  </div>
  <div class="hero">
    <div class="hero-eyebrow">MUSE · AI 账号</div>
    <h1>Muse 账号<span class="grad">10亿 tokens</span></h1>
    <p>一个账号，10 亿 tokens，永不过期。支持视频生成，付款确认后自动发卡。</p>
    <div class="hero-chips"><span>10亿 tokens</span><span>永不过期</span><span>能生成视频</span><span>自动发货</span></div>
    <p class="hero-note">暂不支持语音通话（账号地区限制），下单前请确认。</p>
    <a class="contact-link" onclick="openContact()">联系客服</a>
  </div>
  <div class="marquee"><i class="mq-dot"></i><span>${esc(SETTINGS.announcement || '')}</span></div>
  <div class="tabs">
    <button class="${curTab === 'goods' ? 'active' : ''}" onclick="switchTab('goods')">商品</button>
    <button class="${curTab === 'seller' ? 'active' : ''}" onclick="switchTab('seller')">店铺</button>
  </div>
  ${curTab === 'seller' ? `
    <div class="seller-card"><h3>店铺信息</h3>
      <p>店名：${esc(SETTINGS.shopName || '小铺子')}\n所在地：中国\n主营：Muse AI 账号（10 亿 tokens），付款确认后自动发卡\n客服：${SETTINGS.contactQQ ? 'QQ ' + esc(SETTINGS.contactQQ) : ''}${SETTINGS.contactWechat ? '　微信 ' + esc(SETTINGS.contactWechat) : ''}${!SETTINGS.contactQQ && !SETTINGS.contactWechat ? '请点右上角“联系客服”' : ''}</p>
    </div>
    <div class="seller-card"><h3>店铺公告</h3><p>${esc(SETTINGS.announcement || '')}</p></div>
    <div class="seller-card"><h3>经营信息</h3><p>本店为个人小店，只卖 Muse AI 账号虚拟商品，不涉及实物发货。账号付款确认后自动发放到订单页。账号一经发出不支持退款，请下单前确认功能说明：支持视频生成，暂不支持语音通话。</p></div>` : `
    <div class="cats">${cats.map(([k, label]) => `
      <button class="${curCat === k ? 'active' : ''}" onclick="setCat('${k}')">${label} <span class="n">${k === '' ? allItems.length : (catCounts[k] || 0)}</span></button>`).join('')}
    </div>
    <div class="grid">${cards}</div>
    ${stepsHtml()}
    ${confirmCardHtml()}`}
  <footer>小铺子 · Muse 账号专卖<br>10 亿 tokens · 永不过期 · 付款确认后自动发卡<br>账号一经发出不支持退款，下单前请确认功能说明<br><a href="/admin.html" style="color:var(--text-tertiary)">店主管理后台</a></footer>`;
  const si = $('#searchInput');
  if (si) si.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
}

function switchTab(t) { curTab = t; if (t !== 'search') searchQuery = ''; renderHome(); window.scrollTo(0, 0); }
function setCat(c) { curCat = c; curTab = 'goods'; renderHome(); }
function doSearch() { searchQuery = ($('#searchInput') || {}).value.trim() || ''; renderHome(); }

// ---------- 详情 ----------
function goDetail(id) { location.hash = '#/goods/' + id; }
function renderDetail() {
  const it = allItems.find((x) => x.id === detailId);
  if (!it) { location.hash = '#/'; return; }
  $('#app').innerHTML = `
  <div class="detail-top"><button onclick="location.hash='#/'">‹</button><h2>${esc(it.name)}</h2></div>
  <div class="detail-poster" style="background:${it.color}">${it.emoji}</div>
  <div class="shop-row">
    <div class="avatar">M</div><div class="nm">${esc(SETTINGS.shopName || '小铺子')}</div>
    <button onclick="location.hash='#/'">进店逛逛</button>
  </div>
  <div class="detail-body">
    <h2>${esc(it.name)} ${it.autoDeliver ? '<span class="tag-auto">✓ 自动发货</span>' : ''}</h2>
    <div class="price"><small>¥</small>${it.price}</div>
    <p style="font-size:13px;color:var(--text-tertiary)">${esc(it.game)}${it.platform ? ' · ' + esc(it.platform) : ''}${it.region ? ' · 适用：' + esc(it.region) : ''} · ${stockText(it)}${it.sales ? ' · 已售 ' + it.sales : ''}</p>
    <div class="feat-strip"><span>10亿 tokens</span><span>永不过期</span><span>能生成视频</span><span>自动发货</span></div>
  </div>
  <div class="desc-box"><h3>账号说明</h3>
    <p>${esc(it.desc)}</p>
    <div class="cap-list">
      <div class="cap"><span class="mark ok">✓</span><b>AI 对话</b><span>10 亿 tokens，永不过期</span></div>
      <div class="cap"><span class="mark ok">✓</span><b>视频生成</b><span>支持生成视频</span></div>
      <div class="cap"><span class="mark no">✕</span><b>语音通话</b><span>暂不支持（账号地区限制）</span></div>
    </div>
    <div class="warn">购买须知：每单发放 1 个账号，含邮箱、密码与接验证码链接。付款后请按付款页提示扫码，确认收款后账号自动发放到订单页。
账号一经发出不支持退款，请下单前确认功能说明。
收到账号后请尽快登录并修改密码，不要向他人泄露邮箱、密码与验证码。</div>
  </div>
  ${stepsHtml()}
  ${confirmCardHtml()}
  <div style="height:90px"></div>
  <div class="buybar">
    <button class="bb" onclick="location.hash='#/'"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></span>店铺</button>
    <button class="bb" onclick="goOrder()"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></span>订单</button>
    <button class="bb" onclick="openContact()"><span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>客服</button>
    <button class="buy-now" ${it.stock <= 0 ? 'disabled' : ''} onclick="openBuy('${it.id}')">${it.stock <= 0 ? '缺货补货中' : '立即购买 ¥' + it.price}</button>
  </div>`;
  window.scrollTo(0, 0);
}

// ---------- 下单弹窗 ----------
function openBuy(id) {
  const it = allItems.find((x) => x.id === id);
  if (!it || it.stock <= 0) return;
  buyState = { item: it, qty: 1, email: '', payMethod: 'wechat' };
  renderBuySheet();
}
function renderBuySheet() {
  const b = buyState;
  const it = b.item;
  $('#sheet').innerHTML = `
  <div class="grab"></div>
  <div class="sheet-step">第 1 步 · 确认订单</div>
  <div class="mini-goods">
    <div class="thumb" style="background:${it.color}">${it.emoji}</div>
    <div class="t"><b>${esc(it.name)}</b><span class="price" style="font-size:18px"><small>¥</small>${it.price}</span> ${it.autoDeliver ? '<span class="tag-auto">✓ 自动发货</span>' : ''}</div>
    <button class="btn-ghost" style="border:none;font-size:20px" onclick="closeModal()">✕</button>
  </div>
  <div class="desc-scroll">${esc(it.desc)}\n账号一经发出不支持退款。请确认功能说明：支持视频生成，暂不支持语音通话。</div>
  <h3>数量</h3>
  <div class="stepper">
    <button onclick="chQty(-1)" ${b.qty <= 1 ? 'disabled' : ''}>−</button>
    <span class="qty">${b.qty}</span>
    <button onclick="chQty(1)" ${b.qty >= it.stock ? 'disabled' : ''}>＋</button>
    <span style="font-size:12px;color:var(--text-tertiary);margin-left:8px">${stockText(it)}</span>
  </div>
  ${it.stock <= 1 ? '<div class="hint">库存仅剩 1 件，每单限购 1 个账号。</div>' : ''}
  <h3>联系邮箱</h3>
  <input type="email" id="buyEmail" placeholder="用于接收发货信息及订单通知" value="${esc(b.email)}">
  <div class="hint">用来接收订单通知，也可凭这个邮箱查单。请填你自己的常用邮箱。</div>
  <h3>支付方式</h3>
  <div class="pay-methods">
    <button class="${b.payMethod === 'wechat' ? 'sel' : ''}" onclick="setPay('wechat')">微信支付</button>
    <button class="${b.payMethod === 'alipay' ? 'sel' : ''}" onclick="setPay('alipay')">支付宝支付</button>
  </div>
  <div class="hint">扫码支付 ¥10，付款后点「我已付款」，确认收款后自动发卡。</div>
  <div class="foot">
    <div class="total">合计 <b>¥${(it.price * b.qty).toFixed(2)}</b> <span style="font-size:12px;color:var(--text-tertiary)">商品金额 ¥${(it.price * b.qty).toFixed(2)}</span></div>
    <button class="btn-orange" onclick="confirmBuy()">确认下单</button>
  </div>`;
  $('#modal').classList.add('open');
}
function chQty(d) {
  const b = buyState;
  b.qty = Math.min(b.item.stock, Math.max(1, b.qty + d));
  b.email = ($('#buyEmail') || {}).value || b.email;
  renderBuySheet();
}
function setPay(m) {
  buyState.payMethod = m;
  buyState.email = ($('#buyEmail') || {}).value || buyState.email;
  renderBuySheet();
}
async function confirmBuy() {
  const b = buyState;
  b.email = ($('#buyEmail') || {}).value.trim();
  if (!/^\S+@\S+\.\S+$/.test(b.email)) { alert('请填写正确的联系邮箱'); return; }
  try {
    const d = await api('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ productId: b.item.id, qty: b.qty, email: b.email, payMethod: b.payMethod }) });
    currentOrder = d;
    renderPaySheet(d);
  } catch (e) { alert(e.message); }
}

// ---------- 付款页 ----------
function renderPaySheet(d) {
  const payName = d.payMethod === 'wechat' ? '微信支付' : '支付宝支付';
  $('#sheet').innerHTML = `
  <div class="grab"></div>
  <div class="sheet-step" style="text-align:center">第 2 步 · 扫码付款</div>
  <h2 style="text-align:center">扫码付款 · ${payName}</h2>
  <div class="order-no">订单号：<b>${d.orderNo}</b>　实付 <b>¥${Number(d.total).toFixed(2)}</b></div>
  <div class="pay-qr">${d.qr ? `<img src="${d.qr}" alt="收款码">` : '<div class="noqr">店主尚未上传收款码<br>请联系客服索要收款方式</div>'}</div>
  <p class="hint" style="text-align:center">请用${payName}扫码支付 ¥${Number(d.total).toFixed(2)}，付完点下方“我已付款”</p>
  <h3>交易单号（选填，方便店主对账）</h3>
  <input type="text" id="txidInput" placeholder="微信/支付宝账单详情里的交易单号后几位">
  <div class="note">付款后请点「我已付款」。${SETTINGS.autoDeliver ? '系统自动发卡，账号会直接显示在订单页。' : '店主确认收款后会自动发卡，账号会显示在订单页，一般几分钟内，请留意订单状态。'}</div>
  <div class="foot">
    <button class="btn-ghost" onclick="closeModal(); goOrderNo('${d.orderNo}')">稍后付款</button>
    <button class="btn-orange" style="flex:1" onclick="markPaid('${d.orderNo}')">我已付款</button>
  </div>`;
  $('#modal').classList.add('open');
}
async function markPaid(orderNo) {
  const txid = ($('#txidInput') || {}).value.trim() || '';
  try {
    const o = await api('/api/orders/' + orderNo + '/paid', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ txid }) });
    closeModal();
    renderOrderDetail(o);
  } catch (e) { alert(e.message); }
}

// ---------- 查单 ----------
function goOrder() { location.hash = '#/order'; }
function goOrderNo(no) { location.hash = '#/order/' + no; }
function renderOrderQuery() {
  $('#app').innerHTML = `
  <div class="detail-top"><button onclick="location.hash='#/'">‹</button><h2>订单查询</h2></div>
  <div style="background:var(--bg-white);border:1px solid var(--border);border-radius:var(--radius-md);margin:16px;padding:18px 14px;text-align:center">
    <h2 style="font-size:18px">查询我的订单</h2>
    <p style="font-size:13px;color:var(--text-secondary);margin:6px 0 14px">输入下单时填的邮箱或订单号，查看付款状态和已发放的账号</p>
    <input type="text" id="queryInput" placeholder="下单邮箱 或 订单号（XP 开头）" style="margin-top:0;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;width:100%;max-width:400px">
    <button class="btn-orange" style="width:100%;max-width:400px;margin-top:10px" onclick="doQuery()">查询订单</button>
    <p class="hint" style="margin-top:8px">例如：your@email.com 或 XP1234567890</p>
  </div>
  <div id="queryResult"></div>
  <div class="seller-card"><h3>防骗提醒</h3><p>本店只在站内交易。本店不会主动要求私下转账、索要密码或验证码，也不会引导你去站外付款。凡是让你先转账再发账号的，都是骗子。如对订单有疑问，请在 24 小时内联系客服并提供订单号。</p></div>
  <footer>小铺子 · Muse 账号专卖</footer>`;
}
async function doQuery() {
  const v = ($('#queryInput') || {}).value.trim();
  if (!v) { alert('请填写邮箱或订单号'); return; }
  const box = $('#queryResult');
  box.innerHTML = '<div class="empty">查询中…</div>';
  try {
    if (/^XP/i.test(v)) {
      const o = await api('/api/orders/' + encodeURIComponent(v));
      renderOrderDetail(o, true);
      return;
    }
    const d = await api('/api/orders?email=' + encodeURIComponent(v));
    if (!d.orders.length) { box.innerHTML = '<div class="empty">没有找到该邮箱的订单<br>请确认邮箱就是下单时填的那个</div>'; return; }
    box.innerHTML = d.orders.map((o) => `
      <div class="order-card" onclick="goOrderNo('${o.orderNo}')">
        <div class="row1"><span class="nm">${esc(o.name)} × ${o.qty}</span><span class="${statusClass(o.status)}">${statusLabel(o.status)}</span></div>
        <div class="sub">订单号：${o.orderNo}<br>实付 ¥${Number(o.total).toFixed(2)} · ${new Date(o.createdAt).toLocaleString()}</div>
      </div>`).join('');
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function loadOrderDetail(orderNo) {
  try {
    const o = await api('/api/orders/' + encodeURIComponent(orderNo));
    renderOrderDetail(o);
  } catch (e) {
    $('#app').innerHTML = `<div class="detail-top"><button onclick="location.hash='#/order'">‹</button><h2>订单详情</h2></div><div class="empty">${esc(e.message)}</div>`;
  }
}
function renderOrderDetail(o, fromQuery) {
  const codesHtml = o.status === 'delivered' && o.codes && o.codes.length ? `
    <div class="seller-card"><h3>第 3 步 · 账号已发放</h3>
      ${o.codes.map((c) => {
        if (c.email) {
          return `<div class="account-hero"><h3>你的 Muse 账号</h3><div class="ah-sub">请尽快登录并修改密码，妥善保管。</div>
            <div class="acc-row"><span class="kv-label">账号邮箱</span><code>${esc(c.email)}</code><button onclick="copyText(this.getAttribute('data-v'))" data-v="${esc(c.email)}">复制</button></div>
            <div class="acc-row"><span class="kv-label">登录密码</span><code>${esc(c.password || '')}</code><button onclick="copyText(this.getAttribute('data-v'))" data-v="${esc(c.password || '')}">复制</button></div>
            <div class="acc-row"><span class="kv-label">接验证码</span><a href="${esc(c.inboxUrl || '')}" target="_blank" rel="noopener">打开查看验证码</a><button onclick="copyText(this.getAttribute('data-v'))" data-v="${esc(c.inboxUrl || '')}">复制链接</button></div>
            <div class="login-steps"><h4>如何登录</h4><ol>
              <li>打开 muse.ai，点登录。</li>
              <li>输入上面的账号邮箱和密码。</li>
              <li>如需验证码，点「接验证码」查看最新验证码，填入即可。</li>
              <li>登录成功后请尽快修改密码。</li>
            </ol></div>
            <div class="kwarn">这个账号只发给你一个人。不要把邮箱、密码、验证码告诉任何人，也不要在站外交易。</div></div>`;
        }
        return `<div class="keybox"><code>${esc(c.code)}</code>${c.demo ? '<div class="kwarn">演示码，仅供展示，无法真实兑换</div>' : '<div class="kwarn">请尽快使用，勿向他人泄露</div>'}<button onclick="copyText('${esc(c.code)}')">复制</button></div>`;
      }).join('')}
    </div>` : '';
  const tip = o.status === 'pending' ? '<div class="note">订单还没付款：请回到商品页重新下单，或联系客服。</div>'
    : o.status === 'paid' ? '<div class="note">已收到你的「我已付款」，确认收款后账号会自动发放到这里，请稍等片刻再刷新查看。</div>'
    : o.status === 'delivered' && !o.isKey ? '<div class="note">如登录遇到问题，请联系客服并提供订单号。</div>'
    : o.status === 'cancelled' ? '<div class="note">订单已取消。如已付款但订单被取消，请联系客服并提供订单号。</div>' : '';
  $('#app').innerHTML = `
  <div class="detail-top"><button onclick="location.hash='#/order'">‹</button><h2>订单详情</h2></div>
  <div class="seller-card">
    <div class="row1" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:16px;font-weight:bold">${esc(o.name)} × ${o.qty}</span><span class="${statusClass(o.status)}">${statusLabel(o.status)}</span></div>
    <p style="margin-top:8px">订单号：${o.orderNo}<br>实付金额：¥${Number(o.total).toFixed(2)} · ${o.payMethod === 'wechat' ? '微信支付' : '支付宝支付'}<br>下单时间：${new Date(o.createdAt).toLocaleString()}${o.deliveredAt ? '<br>发货时间：' + new Date(o.deliveredAt).toLocaleString() : ''}</p>
  </div>
  ${tip}
  ${codesHtml}
  <div style="padding:0 12px 40px"><button class="btn-orange" style="width:100%" onclick="location.hash='#/'">继续逛逛</button></div>`;
  window.scrollTo(0, 0);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('已复制'));
  else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('已复制'); }
}

// ---------- 菜单 / 客服弹窗 ----------
function openMenu() {
  $('#sheet').innerHTML = `
  <div class="grab"></div><h2>菜单</h2>
  <button class="menu-item" onclick="closeModal(); goOrder()">订单查询</button>
  <button class="menu-item" onclick="closeModal(); openContact()">联系客服</button>
  <button class="menu-item" onclick="closeModal(); switchTab('seller'); location.hash='#/'">店铺信息</button>
  <button class="menu-item" onclick="closeModal(); showAnnounce()">店铺公告</button>`;
  $('#modal').classList.add('open');
}
function openContact() {
  const qq = SETTINGS.contactQQ, wx = SETTINGS.contactWechat;
  $('#sheet').innerHTML = `
  <div class="grab"></div><h2>联系客服</h2>
  <p class="hint">在线客服：请通过以下方式联系店主（工作时间一般几分钟内回复）</p>
  ${qq ? `<div class="order-card" style="margin:10px 0">QQ：<b>${esc(qq)}</b> <button class="btn-ghost" style="float:right;padding:5px 12px" onclick="copyText('${esc(qq)}')">复制</button></div>` : ''}
  ${wx ? `<div class="order-card" style="margin:10px 0">微信：<b>${esc(wx)}</b> <button class="btn-ghost" style="float:right;padding:5px 12px" onclick="copyText('${esc(wx)}')">复制</button></div>` : ''}
  ${!qq && !wx ? '<div class="note">店主尚未填写客服联系方式，请稍后再来，或在查单页凭订单号查询订单状态。</div>' : ''}
  <div class="foot"><button class="btn-orange" style="flex:1" onclick="closeModal()">知道了</button></div>`;
  $('#modal').classList.add('open');
}
function showAnnounce() {
  $('#sheet').innerHTML = `
  <div class="grab"></div><h2>店铺公告</h2>
  <p style="font-size:14px;line-height:1.8;white-space:pre-line">${esc(SETTINGS.announcement || '')}</p>
  <div class="foot"><button class="btn-orange" style="flex:1" onclick="closeModal()">我知道了</button></div>`;
  $('#modal').classList.add('open');
}
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

// ---------- 路由 / 初始化 ----------
function route() {
  const h = location.hash || '#/';
  const m = h.match(/^#\/goods\/(.+)$/);
  const om = h.match(/^#\/order\/(.+)$/);
  if (m) { detailId = decodeURIComponent(m[1]); renderDetail(); }
  else if (om) { loadOrderDetail(decodeURIComponent(om[1])); }
  else if (h === '#/order') { renderOrderQuery(); }
  else { renderHome(); }
}
window.addEventListener('hashchange', route);

async function init() {
  try {
    SETTINGS = await api('/api/public-settings');
    const d = await api('/api/items');
    allItems = d.items;
    catCounts = d.counts || {};
  } catch (e) {
    $('#app').innerHTML = '<div class="empty">页面暂时打不开，请稍后再试<br>' + esc(e.message) + '</div>';
    return;
  }
  route();
  if (!localStorage.getItem('xp-announce-seen')) {
    setTimeout(() => { showAnnounce(); localStorage.setItem('xp-announce-seen', '1'); }, 600);
  }
}
init();
</script>
</body>
</html>
