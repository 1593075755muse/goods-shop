<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小铺子 · 数字卡密自动交易平台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f5f5f7;
    --bg-white: #fff;
    --text: #1d1d1f;
    --text-secondary: #6e6e73;
    --text-tertiary: #86868b;
    --accent: #0071e3;
    --accent-hover: #0066cc;
    --border: #d2d2d7;
    --divider: rgba(0,0,0,.08);
    --green: #34c759;
    --green-bg: #e8f5e9;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.04);
    --shadow-md: 0 4px 16px rgba(0,0,0,.06);
    --shadow-lg: 0 8px 30px rgba(0,0,0,.08);
    --radius-sm: 12px;
    --radius-md: 18px;
    --radius-lg: 20px;
    --radius-pill: 999px;
    --max-width: 1200px;
  }
  html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body { font-family: -apple-system, "SF Pro Display", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.47059; font-size: 17px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font-family: inherit; cursor: pointer; }

  /* 顶部导航：白色毛玻璃 */
  .topbar {
    background: rgba(255,255,255,.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--divider);
    color: var(--text);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 30;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .topbar .logo { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar .logo small { display: block; font-size: 11px; font-weight: 400; color: var(--text-tertiary); }
  .topbar .obtn {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 6px 14px;
    font-size: 13px;
    font-weight: 500;
    white-space: nowrap;
    transition: background .15s, border-color .15s;
  }
  .topbar .obtn:hover { background: var(--border); }
  .topbar .menu-btn { background: none; border: none; color: var(--text); font-size: 22px; line-height: 1; padding: 6px; }

  /* Hero 区：苹果风大标题 */
  .hero {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: 56px 16px 40px;
    text-align: center;
  }
  .hero h1 {
    font-size: clamp(40px, 6vw, 64px);
    font-weight: 600;
    letter-spacing: -.003em;
    line-height: 1.1;
    color: var(--text);
    margin-bottom: 12px;
  }
  .hero p {
    font-size: clamp(17px, 2vw, 21px);
    font-weight: 400;
    color: var(--text-secondary);
    line-height: 1.4;
    max-width: 580px;
    margin: 0 auto;
  }
  .hero .contact-link {
    display: inline-block;
    margin-top: 28px;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: 500;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: var(--radius-pill);
    transition: background .15s, color .15s;
  }
  .hero .contact-link:hover {
    background: var(--accent);
    color: #fff;
    text-decoration: none;
  }

  /* 公告栏 */
  .marquee {
    background: var(--bg-white);
    border-top: 1px solid var(--divider);
    border-bottom: 1px solid var(--divider);
    padding: 10px 16px;
    font-size: 13px;
    color: var(--text-secondary);
    display: flex; gap: 8px; align-items: center; overflow: hidden;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .marquee span { white-space: nowrap; animation: scroll 20s linear infinite; display: inline-block; }
  @keyframes scroll { from { transform: translateX(100%);} to { transform: translateX(-100%);} }

  /* 页签 */
  .tabs {
    display: flex;
    background: var(--bg-white);
    border-bottom: 1px solid var(--divider);
    position: sticky;
    top: 52px;
    z-index: 20;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .tabs button {
    flex: 1;
    padding: 14px 0;
    background: none;
    border: none;
    font-size: 15px;
    font-weight: 500;
    color: var(--text-secondary);
    position: relative;
    transition: color .15s;
  }
  .tabs button.active {
    color: var(--text);
  }
  .tabs button.active::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 40px;
    height: 2px;
    background: var(--text);
    border-radius: 1px;
  }

  /* 分类横向滚动 */
  .cats {
    display: flex;
    gap: 8px;
    padding: 16px 16px 8px;
    overflow-x: auto;
    scrollbar-width: none;
    background: var(--bg);
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .cats::-webkit-scrollbar { display: none; }
  .cats button {
    flex-shrink: 0;
    padding: 8px 16px;
    border-radius: var(--radius-pill);
    border: 1px solid var(--border);
    background: var(--bg-white);
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary);
    transition: all .15s;
  }
  .cats button:hover { border-color: var(--text); color: var(--text); }
  .cats button.active {
    background: var(--text);
    color: var(--bg-white);
    border-color: var(--text);
  }
  .cats button .n { opacity: .6; font-size: 11px; margin-left: 4px; }

  /* 商品网格：响应式列数 */
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
    padding: 16px 16px 100px;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  @media (min-width: 768px) { .grid { grid-template-columns: repeat(3, 1fr); gap: 20px; padding: 20px 24px 100px; } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(4, 1fr); gap: 24px; padding: 24px 24px 100px; } }

  .card {
    background: var(--bg);
    border-radius: var(--radius-md);
    overflow: hidden;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform .15s, box-shadow .15s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    transform: translateY(-2px);
    box-shadow: var(--shadow-md);
  }
  .thumb {
    height: 160px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    position: relative;
    overflow: hidden;
  }
  /* 柔和色块遮罩：在 emoji 图标上叠加半透明白色渐变，降低饱和度 */
  .thumb::after,
  .detail-poster::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,.35) 0%, rgba(255,255,255,.15) 50%, rgba(255,255,255,0) 100%);
    pointer-events: none;
    z-index: 1;
  }
  .thumb > *,
  .detail-poster > * { position: relative; z-index: 2; }

  .card .info { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
  .card h3 {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.33;
    height: 40px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    color: var(--text);
  }
  .card h3 .oos { color: var(--text-tertiary); font-size: 12px; font-weight: 400; }
  .tag-auto {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    color: var(--green);
    margin-top: 6px;
    background: none;
    border: none;
    padding: 0;
  }
  .price {
    color: var(--text);
    font-weight: 600;
    font-size: 19px;
    margin-top: auto;
    padding-top: 8px;
  }
  .price small { font-size: 13px; font-weight: 400; color: var(--text-secondary); }
  .meta-line { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; }

  /* 详情页 */
  .detail-top {
    background: rgba(255,255,255,.72);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid var(--divider);
    padding: 10px 16px;
    display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 30;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .detail-top button { background: none; border: none; font-size: 22px; color: var(--text); padding: 6px; line-height: 1; }
  .detail-top h2 { font-size: 17px; font-weight: 600; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .detail-poster {
    height: 260px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 110px;
    position: relative;
    overflow: hidden;
  }
  .detail-body {
    background: var(--bg-white);
    padding: 24px 16px;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .detail-body h2 {
    font-size: 24px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: -.003em;
  }
  .detail-body .price {
    font-size: 28px;
    font-weight: 600;
    color: var(--text);
    margin: 10px 0 4px;
  }
  .detail-body .price small { font-size: 17px; color: var(--text-secondary); }
  .shop-row {
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--bg);
    margin: 16px 0;
    padding: 16px;
    border-radius: var(--radius-md);
    max-width: var(--max-width);
    margin-left: auto;
    margin-right: auto;
  }
  .shop-row .avatar { width: 44px; height: 44px; font-size: 24px; background: var(--bg); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .shop-row .nm { flex: 1; font-size: 15px; font-weight: 600; }
  .shop-row button {
    border: 1px solid var(--border);
    color: var(--text);
    background: var(--bg-white);
    border-radius: var(--radius-pill);
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 500;
    transition: border-color .15s, background .15s;
  }
  .shop-row button:hover { border-color: var(--text); background: var(--bg); }
  .desc-box {
    background: var(--bg-white);
    margin: 0 0 16px;
    padding: 20px 16px;
    border-radius: var(--radius-md);
    max-width: var(--max-width);
    margin-left: auto;
    margin-right: auto;
  }
  .desc-box h3 { font-size: 17px; font-weight: 600; margin-bottom: 12px; }
  .desc-box .warn {
    color: var(--text-secondary);
    font-size: 14px;
    line-height: 1.7;
    white-space: pre-line;
    background: var(--bg);
    padding: 12px;
    border-radius: var(--radius-sm);
  }
  .desc-box p { font-size: 15px; color: var(--text-secondary); line-height: 1.7; }
  .rec-title {
    font-size: 19px;
    font-weight: 600;
    padding: 8px 16px 16px;
    max-width: var(--max-width);
    margin: 0 auto;
  }

  /* 底部操作栏 */
  .buybar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: rgba(255,255,255,.85);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-top: 1px solid var(--divider);
    display: flex;
    align-items: center;
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    gap: 12px;
    z-index: 30;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .buybar .bb {
    background: none;
    border: none;
    font-size: 11px;
    color: var(--text-tertiary);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    padding: 0 8px;
    flex: 1;
  }
  .buybar .bb span { font-size: 22px; line-height: 1; }
  .buybar .buy-now {
    flex: 2;
    border: none;
    border-radius: var(--radius-pill);
    padding: 14px;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    transition: background .15s;
  }
  .buybar .buy-now:hover { background: var(--accent-hover); }
  .buybar .buy-now:disabled { background: var(--border); color: var(--text-tertiary); }

  /* 底部弹窗 */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 40;
    align-items: flex-end;
    justify-content: center;
  }
  .modal.open { display: flex; }
  .sheet {
    background: var(--bg-white);
    width: 100%;
    max-width: 600px;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    max-height: 88vh;
    overflow: auto;
    box-shadow: var(--shadow-lg);
    position: relative;
  }
  .sheet .grab { width: 44px; height: 5px; background: var(--border); border-radius: 3px; margin: 0 auto 16px; }
  .sheet h2 { font-size: 19px; font-weight: 600; margin-bottom: 12px; }
  .sheet h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; }
  .mini-goods { display: flex; gap: 12px; align-items: center; }
  .mini-goods .thumb { width: 72px; height: 72px; border-radius: var(--radius-sm); font-size: 36px; flex-shrink: 0; position: relative; overflow: hidden; }
  .mini-goods .t { flex: 1; min-width: 0; }
  .mini-goods .t b { font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .desc-scroll {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 12px;
    max-height: 120px;
    overflow: auto;
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
    white-space: pre-line;
    margin-top: 12px;
  }
  .stepper { display: flex; align-items: center; gap: 0; margin-top: 6px; }
  .stepper button {
    width: 40px;
    height: 40px;
    border: 1px solid var(--border);
    background: var(--bg-white);
    font-size: 18px;
    color: var(--text);
    border-radius: 0;
    transition: background .15s, border-color .15s;
  }
  .stepper button:first-child { border-radius: var(--radius-sm) 0 0 var(--radius-sm); }
  .stepper button:last-child { border-radius: 0 var(--radius-sm) var(--radius-sm) 0; }
  .stepper button:disabled { color: var(--border); }
  .stepper button:hover:not(:disabled) { background: var(--bg); }
  .stepper .qty {
    width: 56px;
    text-align: center;
    border-top: 1px solid var(--border);
    border-bottom: 1px solid var(--border);
    line-height: 38px;
    font-size: 17px;
    font-weight: 500;
  }
  input[type="text"], input[type="email"], textarea {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    font-size: 15px;
    margin-top: 6px;
    background: var(--bg-white);
    color: var(--text);
    transition: border-color .15s, box-shadow .15s;
  }
  input[type="text"]:focus, input[type="email"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,113,227,.15);
  }
  .hint { font-size: 12px; color: var(--text-tertiary); margin-top: 4px; line-height: 1.5; }
  .pay-methods { display: flex; gap: 10px; margin-top: 8px; }
  .pay-methods button {
    flex: 1;
    padding: 14px;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--bg-white);
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    transition: all .15s;
  }
  .pay-methods button:hover { border-color: var(--text); }
  .pay-methods button.sel {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(0,113,227,.08);
  }
  .sheet .foot { display: flex; align-items: center; gap: 12px; margin-top: 20px; }
  .sheet .foot .total { flex: 1; font-size: 15px; }
  .sheet .foot .total b { color: var(--text); font-size: 22px; font-weight: 600; }
  .btn-orange {
    border: none;
    border-radius: var(--radius-pill);
    padding: 14px 28px;
    font-size: 17px;
    font-weight: 600;
    color: #fff;
    background: var(--accent);
    transition: background .15s;
  }
  .btn-orange:hover { background: var(--accent-hover); }
  .btn-orange:disabled { background: var(--border); color: var(--text-tertiary); }
  .btn-ghost {
    border: 1px solid var(--border);
    border-radius: var(--radius-pill);
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 500;
    background: var(--bg-white);
    color: var(--text);
    transition: border-color .15s, background .15s;
  }
  .btn-ghost:hover { border-color: var(--text); background: var(--bg); }

  /* 支付页 */
  .pay-qr { text-align: center; padding: 10px 0; }
  .pay-qr img { width: 240px; height: 240px; object-fit: contain; border: 1px solid var(--border); border-radius: var(--radius-md); }
  .pay-qr .noqr { width: 240px; height: 240px; margin: 0 auto; border: 1px dashed var(--border); border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; color: var(--text-tertiary); font-size: 14px; padding: 20px; line-height: 1.6; }
  .order-no { text-align: center; font-size: 15px; margin: 6px 0; color: var(--text-secondary); }
  .order-no b { color: var(--text); }

  /* 卡密盒 */
  .keybox {
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: var(--radius-sm);
    padding: 14px;
    margin: 12px 0;
  }
  .keybox code { display: block; font-size: 17px; letter-spacing: 1px; padding: 8px 0; word-break: break-all; font-family: -apple-system, "SF Mono", monospace; }
  .keybox .kwarn { font-size: 12px; color: var(--text-secondary); margin-top: 8px; }
  .keybox button {
    margin-top: 8px;
    border: 1px solid var(--border);
    color: var(--text);
    background: var(--bg-white);
    border-radius: var(--radius-pill);
    padding: 8px 18px;
    font-size: 13px;
    font-weight: 500;
  }
  .keybox button:hover { border-color: var(--text); }

  .status-pill { display: inline-block; font-size: 12px; font-weight: 500; border-radius: var(--radius-pill); padding: 4px 10px; }
  .st-pending { background: #fff4d6; color: #8a6000; }
  .st-paid { background: #dbeafe; color: #1e40af; }
  .st-delivered { background: #dcfce7; color: #166534; }
  .st-cancelled { background: #fee2e2; color: #991b1b; }

  .order-card { background: var(--bg-white); border-radius: var(--radius-md); padding: 16px; margin: 12px 16px; cursor: pointer; box-shadow: var(--shadow-sm); transition: box-shadow .15s; }
  .order-card:hover { box-shadow: var(--shadow-md); }
  .order-card .row1 { display: flex; justify-content: space-between; align-items: center; }
  .order-card .nm { font-size: 15px; font-weight: 600; }
  .order-card .sub { font-size: 13px; color: var(--text-tertiary); margin-top: 6px; line-height: 1.6; }

  /* 商家页 */
  .seller-card { background: var(--bg-white); border-radius: var(--radius-md); padding: 20px 16px; margin: 16px; box-shadow: var(--shadow-sm); }
  .seller-card h3 { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
  .seller-card p { font-size: 14px; color: var(--text-secondary); line-height: 1.8; white-space: pre-line; }

  /* 搜索条 */
  .search-wrap { background: var(--bg-white); padding: 16px; display: flex; gap: 10px; max-width: var(--max-width); margin: 0 auto; }
  .search-wrap input { flex: 1; margin-top: 0; padding: 12px 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 15px; }
  .search-wrap input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,113,227,.15); }
  .search-wrap button {
    border: none;
    border-radius: var(--radius-sm);
    padding: 0 24px;
    color: #fff;
    background: var(--accent);
    font-size: 15px;
    font-weight: 600;
    transition: background .15s;
  }
  .search-wrap button:hover { background: var(--accent-hover); }

  .empty { text-align: center; color: var(--text-tertiary); padding: 60px 20px; font-size: 15px; line-height: 1.8; }
  .note {
    background: rgba(0,113,227,.08);
    color: var(--accent);
    padding: 12px 16px;
    border-radius: var(--radius-sm);
    font-size: 13px;
    margin: 12px 0;
    line-height: 1.6;
  }
  footer {
    text-align: center;
    font-size: 12px;
    color: var(--text-tertiary);
    padding: 24px 16px 100px;
    line-height: 1.8;
    max-width: var(--max-width);
    margin: 0 auto;
  }
  .menu-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 16px 4px;
    background: none;
    border: none;
    border-bottom: 1px solid var(--divider);
    font-size: 17px;
    color: var(--text);
  }
  .menu-item:last-child { border-bottom: none; }

  /* 弹窗关闭按钮 */
  .sheet .close-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg);
    border: none;
    font-size: 18px;
    color: var(--text-secondary);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .sheet .close-btn:hover { background: var(--border); color: var(--text); }
</style>
</head>
<body>
<div id="app"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
let SETTINGS = {};
let allItems = [];
let catCounts = {};
let curCat = '';
let searchQuery = '';
let curTab = 'goods'; // goods | seller | search
let detailId = null;
let buyState = null; // {item, qty, email, payMethod}
let currentOrder = null;

const $ = (s) => document.querySelector(s);
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function statusLabel(s) {
  return { pending: '待付款', paid: '待确认收款', delivered: '已发货', cancelled: '已取消' }[s] || s;
}
function statusClass(s) { return 'status-pill st-' + s; }

async function api(path, opts) {
  const r = await fetch(path, opts);
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || '请求失败');
  return d;
}

// ---------- 首页 ----------
function renderHome() {
  const cats = [['', '综合'], ...Object.entries({ skin: '武器皮肤', crate: '补给箱', outfit: '服装', emote: '表情', key: '激活码' })];
  let list = allItems;
  if (curTab === 'goods' && curCat) list = list.filter((it) => it.category === curCat);
  if (curTab === 'search' && searchQuery) {
    const q = searchQuery.toLowerCase();
    list = list.filter((it) => it.name.toLowerCase().includes(q) || it.game.toLowerCase().includes(q) || (it.desc || '').toLowerCase().includes(q));
  }
  const cards = list.length ? list.map((it) => `
    <div class="card" onclick="goDetail('${it.id}')">
      <div class="thumb" style="background:${it.color}">${it.emoji}</div>
      <div class="info">
        <h3>${esc(it.name)}${it.stock <= 0 ? ' <span class="oos">缺货</span>' : ''}</h3>
        ${it.autoDeliver ? '<span class="tag-auto">✓ 自动发货</span>' : ''}
        <div class="price"><small>¥</small>${it.price}</div>
        <div class="meta-line">${esc(it.game)}${it.stock > 0 ? ' · 库存 ' + it.stock + ' 件' : ' · 补货中'}${it.sales ? ' · 已售 ' + it.sales : ''}</div>
      </div>
    </div>`).join('') : `<div class="empty">没有找到相关商品<br>换个关键词试试</div>`;

  $('#app').innerHTML = `
  <div class="topbar">
    <div class="logo">${esc(SETTINGS.shopName || '小铺子')}<small>专业数字卡密自动交易平台</small></div>
    <button class="obtn" onclick="goOrder()">订单查询</button>
    <button class="menu-btn" onclick="openMenu()">☰</button>
  </div>
  <div class="hero">
    <h1>小铺子。</h1>
    <p>好物，轻松购。PUBG 道具与 Steam 激活码，自动发卡。</p>
    <a class="contact-link" onclick="openContact()">联系客服</a>
  </div>
  <div class="marquee">📢 <span>${esc(SETTINGS.announcement || '')}</span></div>
  <div class="tabs">
    <button class="${curTab === 'goods' ? 'active' : ''}" onclick="switchTab('goods')">宝贝</button>
    <button class="${curTab === 'seller' ? 'active' : ''}" onclick="switchTab('seller')">商家</button>
    <button class="${curTab === 'search' ? 'active' : ''}" onclick="switchTab('search')">搜索</button>
  </div>
  ${curTab === 'search' ? `
    <div class="search-wrap">
      <input type="text" id="searchInput" placeholder="搜索店内商品" value="${esc(searchQuery)}">
      <button onclick="doSearch()">搜索</button>
    </div>
    <p style="padding:4px 14px 0;font-size:12px;color:var(--text-tertiary)">搜本店宝贝 / 输入商品名称或关键词，快速找到心仪宝贝</p>` : ''}
  ${curTab === 'seller' ? `
    <div class="seller-card"><h3>🏪 店铺信息</h3>
      <p>店名：${esc(SETTINGS.shopName || '小铺子')}\n所在地：中国\n主营：游戏道具、Steam 激活码，自动发卡\n客服：${SETTINGS.contactQQ ? 'QQ ' + esc(SETTINGS.contactQQ) : ''}${SETTINGS.contactWechat ? '　微信 ' + esc(SETTINGS.contactWechat) : ''}${!SETTINGS.contactQQ && !SETTINGS.contactWechat ? '请点右上角“联系客服”' : ''}</p>
    </div>
    <div class="seller-card"><h3>📢 店铺公告</h3><p>${esc(SETTINGS.announcement || '')}</p></div>
    <div class="seller-card"><h3>📋 经营信息</h3><p>本店为个人小店，仅出售虚拟数字商品（游戏道具、激活码），不涉及实物发货。激活码类商品付款确认后自动发卡，卡密一经发出不支持退款，请下单前确认好商品。</p></div>` : `
    <div class="cats">${cats.map(([k, label]) => `
      <button class="${curCat === k ? 'active' : ''}" onclick="setCat('${k}')">${label} <span class="n">${k === '' ? allItems.length : (catCounts[k] || 0)}</span></button>`).join('')}
    </div>
    <div class="grid">${cards}</div>`}
  <footer>小铺子 · 数字卡密自动交易<br>下单即表示同意店内公告与售后说明 · 卡密商品一经发出不支持退款<br><a href="/admin.html" style="color:var(--text-tertiary)">店主管理后台</a></footer>`;
  const si = $('#searchInput');
  if (si) si.addEventListener('keydown', (e) => { if (e.key === 'Enter') doSearch(); });
}

function switchTab(t) { curTab = t; if (t !== 'search') searchQuery = ''; renderHome(); window.scrollTo(0, 0); }
function setCat(c) { curCat = c; curTab = 'goods'; renderHome(); }
function doSearch() { searchQuery = ($('#searchInput') || {}).value.trim() || ''; renderHome(); }

// ---------- 详情 ----------
function goDetail(id) { location.hash = '#/goods/' + id; }
function renderDetail() {
  const it = allItems.find((x) => x.id === detailId);
  if (!it) { location.hash = '#/'; return; }
  const recs = allItems.filter((x) => x.id !== it.id && x.category === it.category).slice(0, 6);
  const recList = recs.length ? recs : allItems.filter((x) => x.id !== it.id).slice(0, 6);
  $('#app').innerHTML = `
  <div class="detail-top"><button onclick="location.hash='#/'">‹</button><h2>${esc(it.name)}</h2></div>
  <div class="detail-poster" style="background:${it.color}">${it.emoji}</div>
  <div class="shop-row">
    <div class="avatar">🛒</div><div class="nm">${esc(SETTINGS.shopName || '小铺子')}</div>
    <button onclick="location.hash='#/'">进店逛逛</button>
  </div>
  <div class="detail-body">
    <h2>${esc(it.name)} ${it.autoDeliver ? '<span class="tag-auto">✓ 自动发货</span>' : ''}</h2>
    <div class="price"><small>¥</small>${it.price}</div>
    <p style="font-size:13px;color:var(--text-tertiary)">${esc(it.game)}${it.platform ? ' · ' + esc(it.platform) : ''}${it.region ? ' · 适用：' + esc(it.region) : ''} · ${it.stock > 0 ? '库存 ' + it.stock + ' 件' : '缺货补货中'}${it.sales ? ' · 已售 ' + it.sales : ''}</p>
  </div>
  <div class="desc-box"><h3>宝贝描述</h3>
    <p>${esc(it.desc)}</p>
    <div class="warn">${it.autoDeliver
      ? '⚠️ 卡密每单一张，下单后请按付款页提示扫码付款，店主确认收款后自动发卡。\n卡密一经发出不支持退款，请下单前确认好商品。\n请妥善保管卡密，勿向他人泄露。'
      : '⚠️ 虚拟道具商品，付款确认后请联系客服提供游戏 ID，由店主手动发货。\n请下单前确认好商品类型与价格。'}</div>
  </div>
  <div class="rec-title">宝贝推荐</div>
  <div class="grid" style="padding-bottom:90px">${recList.map((r) => `
    <div class="card" onclick="goDetail('${r.id}')">
      <div class="thumb" style="background:${r.color}">${r.emoji}</div>
      <div class="info"><h3>${esc(r.name)}</h3>
      <div class="price"><small>¥</small>${r.price}</div></div>
    </div>`).join('')}</div>
  <div class="buybar">
    <button class="bb" onclick="location.hash='#/'"><span>🏪</span>店铺</button>
    <button class="bb" onclick="goOrder()"><span>📋</span>订单</button>
    <button class="bb" onclick="openContact()"><span>💬</span>客服</button>
    <button class="buy-now" ${it.stock <= 0 ? 'disabled' : ''} onclick="openBuy('${it.id}')">${it.stock <= 0 ? '缺货补货中' : '立即购买'}</button>
  </div>`;
  window.scrollTo(0, 0);
}

// ---------- 下单弹窗 ----------
function openBuy(id) {
  const it = allItems.find((x) => x.id === id);
  if (!it || it.stock <= 0) return;
  buyState = { item: it, qty: 1, email: '', payMethod: 'wechat' };
  renderBuySheet();
}
function renderBuySheet() {
  const b = buyState;
  const it = b.item;
  $('#sheet').innerHTML = `
  <div class="grab"></div>
  <div class="mini-goods">
    <div class="thumb" style="background:${it.color}">${it.emoji}</div>
    <div class="t"><b>${esc(it.name)}</b><span class="price" style="font-size:18px"><small>¥</small>${it.price}</span> ${it.autoDeliver ? '<span class="tag-auto">✓ 自动发货</span>' : ''}</div>
    <button class="btn-ghost" style="border:none;font-size:20px" onclick="closeModal()">✕</button>
  </div>
  <div class="desc-scroll">${esc(it.desc)}\n${it.autoDeliver ? '⚠️ 卡密一经发出不支持退款，请确认好再下单。' : '⚠️ 虚拟道具，付款后联系客服发货。'}</div>
  <h3>数量</h3>
  <div class="stepper">
    <button onclick="chQty(-1)" ${b.qty <= 1 ? 'disabled' : ''}>−</button>
    <span class="qty">${b.qty}</span>
    <button onclick="chQty(1)" ${b.qty >= it.stock ? 'disabled' : ''}>＋</button>
    <span style="font-size:12px;color:var(--text-tertiary);margin-left:8px">库存 ${it.stock} 件</span>
  </div>
  <h3>联系邮箱</h3>
  <input type="email" id="buyEmail" placeholder="用于接收发货信息及订单通知" value="${esc(b.email)}">
  <div class="hint">邮箱将用于接收发货信息及订单通知，也可凭邮箱查单。</div>
  <h3>支付方式</h3>
  <div class="pay-methods">
    <button class="${b.payMethod === 'wechat' ? 'sel' : ''}" onclick="setPay('wechat')">💬 微信支付</button>
    <button class="${b.payMethod === 'alipay' ? 'sel' : ''}" onclick="setPay('alipay')">💙 支付宝支付</button>
  </div>
  <div class="foot">
    <div class="total">合计 <b>¥${(it.price * b.qty).toFixed(2)}</b> <span style="font-size:12px;color:var(--text-tertiary)">商品金额 ¥${(it.price * b.qty).toFixed(2)}</span></div>
    <button class="btn-orange" onclick="confirmBuy()">确认支付</button>
  </div>`;
  $('#modal').classList.add('open');
}
function chQty(d) {
  const b = buyState;
  b.qty = Math.min(b.item.stock, Math.max(1, b.qty + d));
  b.email = ($('#buyEmail') || {}).value || b.email;
  renderBuySheet();
}
function setPay(m) {
  buyState.payMethod = m;
  buyState.email = ($('#buyEmail') || {}).value || buyState.email;
  renderBuySheet();
}
async function confirmBuy() {
  const b = buyState;
  b.email = ($('#buyEmail') || {}).value.trim();
  if (!/^\S+@\S+\.\S+$/.test(b.email)) { alert('请填写正确的联系邮箱'); return; }
  try {
    const d = await api('/api/orders', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ productId: b.item.id, qty: b.qty, email: b.email, payMethod: b.payMethod }) });
    currentOrder = d;
    renderPaySheet(d);
  } catch (e) { alert(e.message); }
}

// ---------- 付款页 ----------
function renderPaySheet(d) {
  const payName = d.payMethod === 'wechat' ? '微信支付' : '支付宝支付';
  $('#sheet').innerHTML = `
  <div class="grab"></div>
  <h2 style="text-align:center">扫码付款 · ${payName}</h2>
  <div class="order-no">订单号：<b>${d.orderNo}</b>　实付 <b>¥${Number(d.total).toFixed(2)}</b></div>
  <div class="pay-qr">${d.qr ? `<img src="${d.qr}" alt="收款码">` : '<div class="noqr">店主尚未上传收款码<br>请联系客服索要收款方式</div>'}</div>
  <p class="hint" style="text-align:center">请用${payName}扫码支付 ¥${Number(d.total).toFixed(2)}，付完点下方“我已付款”</p>
  <h3>交易单号（选填，方便店主对账）</h3>
  <input type="text" id="txidInput" placeholder="微信/支付宝账单详情里的交易单号后几位">
  <div class="note">付款后请点“我已付款”。${SETTINGS.autoDeliver ? '系统将自动发卡，卡密会直接显示在下方。' : '店主确认收款后会自动发卡，卡密会显示在订单页（一般几分钟内）。'}</div>
  <div class="foot">
    <button class="btn-ghost" onclick="closeModal(); goOrderNo('${d.orderNo}')">稍后付款</button>
    <button class="btn-orange" style="flex:1" onclick="markPaid('${d.orderNo}')">我已付款</button>
  </div>`;
  $('#modal').classList.add('open');
}
async function markPaid(orderNo) {
  const txid = ($('#txidInput') || {}).value.trim() || '';
  try {
    const o = await api('/api/orders/' + orderNo + '/paid', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ txid }) });
    closeModal();
    renderOrderDetail(o);
  } catch (e) { alert(e.message); }
}

// ---------- 查单 ----------
function goOrder() { location.hash = '#/order'; }
function goOrderNo(no) { location.hash = '#/order/' + no; }
function renderOrderQuery() {
  $('#app').innerHTML = `
  <div class="detail-top"><button onclick="location.hash='#/'">‹</button><h2>订单查询</h2></div>
  <div style="background:var(--bg-white);padding:18px 14px;text-align:center">
    <h2 style="font-size:18px">轻松查询订单，即刻享受自动交易</h2>
    <p style="font-size:13px;color:var(--text-secondary);margin:6px 0 14px">输入邮箱地址或订单号，快速查看订单状态和详情</p>
    <input type="text" id="queryInput" placeholder="请输入下单邮箱地址或订单号" style="margin-top:0;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:15px;width:100%;max-width:400px">
    <button class="btn-orange" style="width:100%;max-width:400px;margin-top:10px" onclick="doQuery()">查询订单</button>
    <p class="hint" style="margin-top:8px">例如：example@email.com 或 XP1234567890</p>
  </div>
  <div id="queryResult"></div>
  <div class="seller-card"><h3>🛡️ 防骗提醒</h3><p>本店不会主动要求私下转账、索要验证码或引导站外交易。如对订单有疑问，请在24小时内联系客服反馈，逾期请自行与店主协商解决。</p></div>
  <footer>小铺子 · 数字卡密自动交易</footer>`;
}
async function doQuery() {
  const v = ($('#queryInput') || {}).value.trim();
  if (!v) { alert('请填写邮箱或订单号'); return; }
  const box = $('#queryResult');
  box.innerHTML = '<div class="empty">查询中…</div>';
  try {
    if (/^XP/i.test(v)) {
      const o = await api('/api/orders/' + encodeURIComponent(v));
      renderOrderDetail(o, true);
      return;
    }
    const d = await api('/api/orders?email=' + encodeURIComponent(v));
    if (!d.orders.length) { box.innerHTML = '<div class="empty">没有找到该邮箱的订单<br>请确认邮箱就是下单时填的那个</div>'; return; }
    box.innerHTML = d.orders.map((o) => `
      <div class="order-card" onclick="goOrderNo('${o.orderNo}')">
        <div class="row1"><span class="nm">${esc(o.name)} × ${o.qty}</span><span class="${statusClass(o.status)}">${statusLabel(o.status)}</span></div>
        <div class="sub">订单号：${o.orderNo}<br>实付 ¥${Number(o.total).toFixed(2)} · ${new Date(o.createdAt).toLocaleString()}</div>
      </div>`).join('');
  } catch (e) { box.innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}
async function loadOrderDetail(orderNo) {
  try {
    const o = await api('/api/orders/' + encodeURIComponent(orderNo));
    renderOrderDetail(o);
  } catch (e) {
    $('#app').innerHTML = `<div class="detail-top"><button onclick="location.hash='#/order'">‹</button><h2>订单详情</h2></div><div class="empty">${esc(e.message)}</div>`;
  }
}
function renderOrderDetail(o, fromQuery) {
  const codesHtml = o.status === 'delivered' && o.codes && o.codes.length ? `
    <div class="seller-card"><h3>🔑 您的卡密（请妥善保管）</h3>
      ${o.codes.map((c) => `<div class="keybox"><code>${esc(c.code)}</code>${c.demo ? '<div class="kwarn">演示卡密，仅供展示，无法真实兑换</div>' : '<div class="kwarn">请尽快使用，勿向他人泄露</div>'}<button onclick="copyText('${esc(c.code)}')">复制卡密</button></div>`).join('')}
    </div>` : '';
  const tip = o.status === 'pending' ? '<div class="note">订单待付款：请返回商品页重新下单，或联系客服。</div>'
    : o.status === 'paid' ? '<div class="note">已收到您的“我已付款”，店主确认收款后会自动发卡，卡密会显示在这里，请稍等片刻再刷新查看。</div>'
    : o.status === 'delivered' && !o.isKey ? '<div class="note">虚拟道具商品已确认，请联系客服提供游戏 ID 安排发货。</div>'
    : o.status === 'cancelled' ? '<div class="note">订单已取消，如有疑问请联系客服。</div>' : '';
  $('#app').innerHTML = `
  <div class="detail-top"><button onclick="location.hash='#/order'">‹</button><h2>订单详情</h2></div>
  <div class="seller-card">
    <div class="row1" style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:16px;font-weight:bold">${esc(o.name)} × ${o.qty}</span><span class="${statusClass(o.status)}">${statusLabel(o.status)}</span></div>
    <p style="margin-top:8px">订单号：${o.orderNo}<br>实付金额：¥${Number(o.total).toFixed(2)} · ${o.payMethod === 'wechat' ? '微信支付' : '支付宝支付'}<br>下单时间：${new Date(o.createdAt).toLocaleString()}${o.deliveredAt ? '<br>发货时间：' + new Date(o.deliveredAt).toLocaleString() : ''}</p>
  </div>
  ${tip}
  ${codesHtml}
  <div style="padding:0 12px 40px"><button class="btn-orange" style="width:100%" onclick="location.hash='#/'">继续逛逛</button></div>`;
  window.scrollTo(0, 0);
}
function copyText(t) {
  if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => alert('已复制'));
  else { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); alert('已复制'); }
}

// ---------- 菜单 / 客服弹窗 ----------
function openMenu() {
  $('#sheet').innerHTML = `
  <div class="grab"></div><h2>菜单</h2>
  <button class="menu-item" onclick="closeModal(); goOrder()">📋 订单查询</button>
  <button class="menu-item" onclick="closeModal(); openContact()">💬 联系客服</button>
  <button class="menu-item" onclick="closeModal(); switchTab('seller'); location.hash='#/'">🏪 商家信息</button>
  <button class="menu-item" onclick="closeModal(); showAnnounce()">📢 店铺公告</button>`;
  $('#modal').classList.add('open');
}
function openContact() {
  const qq = SETTINGS.contactQQ, wx = SETTINGS.contactWechat;
  $('#sheet').innerHTML = `
  <div class="grab"></div><h2>联系客服</h2>
  <p class="hint">在线客服：请通过以下方式联系店主（工作时间一般几分钟内回复）</p>
  ${qq ? `<div class="order-card" style="margin:10px 0">QQ：<b>${esc(qq)}</b> <button class="btn-ghost" style="float:right;padding:5px 12px" onclick="copyText('${esc(qq)}')">复制</button></div>` : ''}
  ${wx ? `<div class="order-card" style="margin:10px 0">微信：<b>${esc(wx)}</b> <button class="btn-ghost" style="float:right;padding:5px 12px" onclick="copyText('${esc(wx)}')">复制</button></div>` : ''}
  ${!qq && !wx ? '<div class="note">店主尚未填写客服联系方式，请通过订单页留言或稍后再来。</div>' : ''}
  <div class="foot"><button class="btn-orange" style="flex:1" onclick="closeModal()">知道了</button></div>`;
  $('#modal').classList.add('open');
}
function showAnnounce() {
  $('#sheet').innerHTML = `
  <div class="grab"></div><h2>📢 店铺公告</h2>
  <p style="font-size:14px;line-height:1.8;white-space:pre-line">${esc(SETTINGS.announcement || '')}</p>
  <div class="foot"><button class="btn-orange" style="flex:1" onclick="closeModal()">我知道了</button></div>`;
  $('#modal').classList.add('open');
}
function closeModal() { $('#modal').classList.remove('open'); }
$('#modal').addEventListener('click', (e) => { if (e.target.id === 'modal') closeModal(); });

// ---------- 路由 / 初始化 ----------
function route() {
  const h = location.hash || '#/';
  const m = h.match(/^#\/goods\/(.+)$/);
  const om = h.match(/^#\/order\/(.+)$/);
  if (m) { detailId = decodeURIComponent(m[1]); renderDetail(); }
  else if (om) { loadOrderDetail(decodeURIComponent(om[1])); }
  else if (h === '#/order') { renderOrderQuery(); }
  else { renderHome(); }
}
window.addEventListener('hashchange', route);

async function init() {
  try {
    SETTINGS = await api('/api/public-settings');
    const d = await api('/api/items');
    allItems = d.items;
    catCounts = d.counts || {};
  } catch (e) {
    $('#app').innerHTML = '<div class="empty">小铺子暂时打不开，请稍后再试<br>' + esc(e.message) + '</div>';
    return;
  }
  route();
  if (!localStorage.getItem('xp-announce-seen')) {
    setTimeout(() => { showAnnounce(); localStorage.setItem('xp-announce-seen', '1'); }, 600);
  }
}
init();
</script>
</body>
